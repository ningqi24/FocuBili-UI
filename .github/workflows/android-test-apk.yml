name: Android Test APK

# 测试用 APK 构建：debug 签名，无需发布密钥，产物仅用于安装验证。
# 正式签名发布仍走 release-build.yml / beta-release.yml。

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - lib/**
      - android/**
      - packages/**
      - assets/**
      - pubspec.yaml
      - pubspec.lock
      - tool/write_build_metadata.dart
      - .github/workflows/android-test-apk.yml

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  test-apk:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug test APK
        run: |
          dart tool/write_build_metadata.dart
          flutter build apk --debug

      - name: Summarize APK
        run: |
          apk='build/app/outputs/flutter-apk/app-debug.apk'
          test -f "$apk"
          printf 'APK_SIZE=%s\n' "$(stat -c '%s' "$apk")"
          printf 'APK_SHA256=%s\n' "$(sha256sum "$apk" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: focubili-test-android
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
